# /etc/portage/make.conf
# Lenovo IdeaPad Gaming 3i 15IHU6
# i5-11300H (Tiger Lake, 4C/8T) | 24 GB RAM | GTX 1650 Max-Q + Iris Xe | NVMe 512 GB
# Perfil: default/linux/amd64/23.0/desktop/plasma/systemd
# Sistema: Gentoo + KDE Plasma (Wayland) + systemd + btrfs + zram (sem swap em disco)

# ---------- Compilação ----------
# -march=native em Tiger Lake = tigerlake (AVX-512 incluso). Sem LTO global.
COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="-Wl,-O1 -Wl,--as-needed"
RUSTFLAGS="-C target-cpu=native"

# 4 núcleos / 8 threads. Sem swap em disco, então os pacotes grandes (chromium,
# firefox, llvm) usam menos jobs via package.env (env/lowmem.conf).
MAKEOPTS="-j8 -l8"
NINJAOPTS="${MAKEOPTS}"

# Compila "por trás" do desktop: o sistema continua responsivo enquanto o portage trabalha.
# (Se preferir como antes, volte PORTAGE_NICENESS para 0.)
PORTAGE_NICENESS="10"
PORTAGE_IONICE_COMMAND="ionice -c 2 -n 7 -p \${PID}"
PORTAGE_SCHEDULING_POLICY="other"

# ---------- Portage ----------
ACCEPT_KEYWORDS="~amd64"
ACCEPT_LICENSE="*"

# buildpkg: guarda um .gpkg de tudo que compila (em /var/cache/binpkgs, subvolume próprio).
# Na próxima reinstalação, --usepkg reaproveita tudo (mesma CPU, mesmo -march=native).
FEATURES="buildpkg parallel-fetch parallel-install"
BINPKG_COMPRESS="zstd"
BINPKG_COMPRESS_FLAGS="-T0 -9"
#FEATURES="${FEATURES} getbinpkg"   # binhost oficial: ajuda pouco com ~amd64 + USE próprias

EMERGE_DEFAULT_OPTS="--verbose --keep-going --usepkg --binpkg-respect-use=y --autounmask-write=y --load-average=8"

PORTAGE_ELOG_CLASSES="info warn error log"
PORTAGE_ELOG_SYSTEM="save"

# ---------- USE global ----------
# O profile desktop/plasma/systemd já liga muita coisa; aqui só o que é seu.
# Removidos de propósito: rocm, mkl (hardware Intel+NVIDIA), qt5 (Plasma 6 não precisa),
# handbook (docs KDE), modemmanager (notebook sem WWAN), ABI_X86 global (ver package.use/40-steam-32bit).
USE="X wayland kde plasma qt6 gtk systemd policykit \
     pipewire sound-server alsa bluetooth networkmanager \
     opengl vulkan egl gbm v4l v4l2 acpi udev dbus \
     openmp blas lapack openblas epub \
     -qt5 -gnome -cuda -dvd -cdr -openrc -elogind -lto -pgo -rocm -mkl -modemmanager"

# ---------- Hardware ----------
VIDEO_CARDS="intel nvidia"
INPUT_DEVICES="libinput"
GRUB_PLATFORMS="efi-64"

# ---------- Idioma ----------
L10N="pt-BR en"
LC_MESSAGES=C.UTF-8

GENTOO_MIRRORS="https://gentoo.c3sl.ufpr.br/ \
    https://br.mirrors.cicku.me/gentoo/ \
    https://umbriel.br.ext.planetunix.net/pub/gentoo/ \
    https://ca.mirrors.cicku.me/gentoo/ \
    https://us.mirrors.cicku.me/gentoo/ \
    https://jp.mirrors.cicku.me/gentoo/ \
    https://gb.mirrors.cicku.me/gentoo/ \
    https://ftp.lysator.liu.se/gentoo/"

# NOTE: This stage was built with the bindist USE flag enabled
